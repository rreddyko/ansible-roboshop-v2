- name: application setup
  include_roles: 
    name: common
    tasks_from: app-setup

- name: install nodejs
  include_roles:
    name: common
    tasks_from: nodejs

- name: copy mongo repo
  copy:
   src: mongo.repo
   dest: /etc/yum.repos.d/mongo.repo

- name: install mongo db client
  dnf:
    name: mongodb-mongosh
    state: present

- name: check products are loaded or not
  command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: load the products
  shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: product_count.stdout | int == 0

- name : daemon reload
  systemd_service:
    daemon_reload: true

- name: start and enable catalog
  service:
    name: catalog
    state: restarted
    enabled: yes