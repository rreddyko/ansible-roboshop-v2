  - name: enable redis
    command: dnf module enable redis:7 -y
  
  - name: install redis
    package: 
      name: redis
      state: present
  
  - name: allow remote connections
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  
  - name: disable protection mode
    Lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protection-mode yes'
      line: 'protection-mode no'
  
  - name: enable and start redis
    service:
      name: redis
      state: start
      enable: yes
