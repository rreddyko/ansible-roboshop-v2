  - name: enable redis
    command: dnf module enable redis:7 -y
  
  - name: install redis
    package: 
      name: redis
      state: present
  
  - name: allow remote connections
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  
  - name: disable protection mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      line: 'protected-mode no'
  
  - name: enable and start redis
    service:
      name: redis
      state: started
      enabled: yes
