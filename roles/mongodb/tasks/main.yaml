  - name: copy mongo repo
    copy: 
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: install monodb server
    dnf:
     name: mongodb-org
     state: present

  - name: start and enable mongodb
    service:
      name: mongod
      state: started
      enabled: yes
  
  - name: Allow remote connections
    lineinfile:
    path: /etc/mongod.conf
    regexp: '^ *bindIp:'
    line: '  bindIp: 0.0.0.0'
    
  - name: restart mongod
    service:
      name: mongod
      state: restarted
     
